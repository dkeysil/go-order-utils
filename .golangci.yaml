version: "2"

run:
  concurrency: 4
  timeout: 10m
  issues-exit-code: 2
  modules-download-mode: readonly
  allow-parallel-runners: true

linters:
  default: none
  enable:
    - errcheck
    - gocyclo
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused
  settings:
    revive:
      rules:
        - name: package-comments
        - name: exported
        - name: var-naming
          arguments:
            - [] # allowlist (initialisms to uppercase)
            - [] # blocklist
            - - upperCaseConst: true # allow ALL_CAPS exported consts (matches SDK naming)
  exclusions:
    generated: lax
    rules:
      # OrderData.TokenId mirrors tokenId on the wire (TS/Py SDKs). Keep the
      # stylistic name even though revive prefers TokenID.
      - path: pkg/model/order\.go
        linters: [revive]
        text: "TokenId should be TokenID"

formatters:
  enable:
    - gofmt
